name: 日記リマインド

on:
  schedule:
    - cron: "0 14 * * *"  # 23:00 JST
    - cron: "0 16 * * *"  # 01:00 JST（DAY_START_HOUR=4 なので前日分として判定）
  workflow_dispatch:
    inputs:
      slot:
        description: "first=23時の文面 / last=1時の文面"
        type: choice
        options: [first, last]
        default: first
      force:
        description: "記入済みでも送信する（テスト用）"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 remind_action.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DIARY_CHANNEL_ID: ${{ secrets.DIARY_CHANNEL_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DAY_START_HOUR: "4"
          SLOT: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 14 * * *' && 'first' || 'last') || inputs.slot }}
          FORCE: ${{ inputs.force && '1' || '' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
